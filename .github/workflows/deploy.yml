# Arsitektur Hybrid CI/CD:
# 1. Build (Nuxt SSR + Go Linux ARM64) di-compile di GitHub Cloud Runner (ubuntu-latest)
#    - Menggunakan CPU multi-core server & NVMe berkecepatan tinggi (~1-2 menit).
# 2. Deploy hanya mendownload bundle jadi dan me-reload PM2 di Armbian (self-hosted)
#    - Armbian TIDAK PERLU compile atau install node_modules berat (~30 detik).
name: Build & Deploy to Server

on:
  push:
    branches: ["main"]
    paths-ignore:
      - "android/**"
      - "capacitor.config.ts"
      - "ANDROID-WIDGET.md"
      - "README.md"
      - "documentation.md"
      - "documentation-api.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "deploy-figo"
  cancel-in-progress: false

jobs:
  build:
    name: Build Nuxt SSR & Go Backend (GitHub Cloud)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Nuxt (SSR / Nitro node-server)
        run: pnpm run build

      - name: Build Go download API (Linux ARM64)
        run: |
          set -e
          cd backend-go
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o figo-download-api .

      - name: Arsipkan hasil build
        run: |
          tar -czf figo-deploy-bundle.tar.gz .output backend-go/figo-download-api ecosystem.config.cjs

      - name: Unggah Artefak Deploy
        uses: actions/upload-artifact@v4
        with:
          name: figo-deploy-bundle
          path: figo-deploy-bundle.tar.gz
          retention-days: 1

  deploy:
    name: Deploy & Reload PM2 (Armbian Server)
    needs: build
    runs-on: [self-hosted, linux]
    steps:
      - name: Unduh Artefak Deploy
        uses: actions/download-artifact@v4
        with:
          name: figo-deploy-bundle

      - name: Publish ke direktori app
        env:
          APP_PATH: ${{ vars.APP_PATH }}
        run: |
          set -e
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: variable APP_PATH belum diset di repo Settings > Variables." >&2
            exit 1
          fi
          mkdir -p "$APP_PATH"
          tar -xzf figo-deploy-bundle/figo-deploy-bundle.tar.gz || tar -xzf figo-deploy-bundle.tar.gz
          rsync -a --delete ./.output/ "$APP_PATH/.output/"
          mkdir -p "$APP_PATH/backend-go"
          cp ./backend-go/figo-download-api "$APP_PATH/backend-go/figo-download-api"
          chmod +x "$APP_PATH/backend-go/figo-download-api"
          cp ./ecosystem.config.cjs "$APP_PATH/ecosystem.config.cjs"
          echo "Publish selesai ke $APP_PATH"

      - name: Reload PM2
        env:
          APP_PATH: ${{ vars.APP_PATH }}
        run: |
          set -e
          cd "$APP_PATH"
          pm2 startOrReload ecosystem.config.cjs --update-env
          pm2 save
          pm2 status
          echo "Deploy & reload selesai."
