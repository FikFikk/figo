name: Build All (Frontend, Backend, Android)

# Workflow otomasi CI/CD cerdas dengan deteksi perubahan file (Path Filtering):
# 1. Mendeteksi berkas mana saja yang berubah pada setiap commit / PR.
# 2. Hanya membangun komponen yang mengalami perbaikan/perubahan (Skip jika tidak ada perubahan).
# 3. Tetap menjalankan seluruh build jika dipicu manual (workflow_dispatch) atau tag rilis (v*).

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # =========================================================================
  # 0. DETEKSI PERUBAHAN FILE (PATH FILTERING)
  # =========================================================================
  changes:
    name: Deteksi Perubahan File
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
      android: ${{ steps.filter.outputs.android }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Periksa Jalur Berkas yang Berubah
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend-go/**'
              - '.github/workflows/build-all.yml'
            frontend:
              - 'app/**'
              - 'server/**'
              - 'public/**'
              - 'nuxt.config.ts'
              - 'tailwind.config.ts'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'scripts/**'
              - '.github/workflows/build-all.yml'
            android:
              - 'android/**'
              - 'capacitor.config.ts'
              - '.github/workflows/build-all.yml'

  # =========================================================================
  # 1. BUILD BACKEND (GO API) - HANYA JIKA ADA PERUBAHAN BACKEND
  # =========================================================================
  build-backend:
    name: Build Backend (Go Binaries)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.backend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.22"
          cache-dependency-path: backend-go/go.sum

      - name: Kompilasi Binary Multi-Platform
        run: |
          set -e
          cd backend-go
          mkdir -p ../dist-binaries

          echo "Mengompilasi untuk Linux AMD64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist-binaries/figo-download-api-linux-amd64 .

          echo "Mengompilasi untuk Linux ARM64..."
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o ../dist-binaries/figo-download-api-linux-arm64 .

          echo "Mengompilasi untuk Windows AMD64..."
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags="-s -w" -o ../dist-binaries/figo-download-api-windows-amd64.exe .

          cd ../dist-binaries
          ls -lh

      - name: Unggah Artefak Binary Backend
        uses: actions/upload-artifact@v4
        with:
          name: figo-backend-binaries
          path: dist-binaries/*
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 2. BUILD FRONTEND (NUXT 4 / NITRO SSR) - HANYA JIKA ADA PERUBAHAN FRONTEND
  # =========================================================================
  build-frontend:
    name: Build Frontend (Nuxt 4 / Nitro)
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.frontend == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Jalankan Pengujian Kontrak UI
        run: node scripts/test_articles_ui.mjs

      - name: Build Nuxt SSR & Nitro Server
        run: pnpm run build

      - name: Arsipkan Bundle .output
        run: |
          tar -czf figo-frontend-output.tar.gz .output

      - name: Unggah Artefak Frontend
        uses: actions/upload-artifact@v4
        with:
          name: figo-frontend-output
          path: figo-frontend-output.tar.gz
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 3. BUILD ANDROID APK (CAPACITOR + GRADLE) - HANYA JIKA ADA PERUBAHAN ANDROID
  # =========================================================================
  build-android:
    name: Build Android APK
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v') || needs.changes.outputs.android == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Setup Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setujui Lisensi Android SDK Runner
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses || true

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web Assets untuk Mobile
        run: pnpm run build

      - name: Sinkronkan Aset Web ke Proyek Android Capacitor
        run: pnpm run android:sync

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4

      - name: Kompilasi Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Temukan dan Salin File APK
        run: |
          mkdir -p dist-apk
          cp android/app/build/outputs/apk/debug/*.apk dist-apk/figo-app-debug.apk
          ls -lh dist-apk/

      - name: Unggah Artefak Android APK
        uses: actions/upload-artifact@v4
        with:
          name: figo-android-apk
          path: dist-apk/figo-app-debug.apk
          if-no-files-found: error
          retention-days: 14

  # =========================================================================
  # 4. PUBLIKASI KE GITHUB RELEASE (JIKA TRIGGER TAG v*)
  # =========================================================================
  release:
    name: Publikasi GitHub Release
    needs: [changes, build-backend, build-frontend, build-android]
    if: startsWith(github.ref, 'refs/tags/v') && !cancelled() && !contains(needs.*.result, 'failure')
    runs-on: ubuntu-latest
    steps:
      - name: Unduh Semua Artefak
        uses: actions/download-artifact@v4
        with:
          path: release-assets

      - name: Tampilkan Daftar Aset
        run: |
          mkdir -p dist-release
          if [ -d "release-assets/figo-backend-binaries" ]; then
            cp -r release-assets/figo-backend-binaries/* dist-release/ || true
          fi
          if [ -d "release-assets/figo-frontend-output" ]; then
            cp -r release-assets/figo-frontend-output/* dist-release/ || true
          fi
          if [ -d "release-assets/figo-android-apk" ]; then
            cp -r release-assets/figo-android-apk/* dist-release/ || true
          fi
          ls -lh dist-release/

      - name: Buat GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
